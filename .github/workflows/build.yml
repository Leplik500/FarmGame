# .github/workflows/build.yml
name: Build Windows Executable
on: [push]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'adopt'
    
    - name: Build JAR
      run: ./gradlew shadowJar
    
    - name: Create Windows Executable
      run: |
        jpackage --input build/libs/ --name "FarmGame" --main-jar FarmGame-1.0-SNAPSHOT-all.jar --main-class org.game.Main --type exe --dest dist/
    
    - name: Upload Artifact
      uses: actions/upload-artifact@v3
      with:
        name: FarmGame-Windows
        path: dist/FarmGame*.exe
